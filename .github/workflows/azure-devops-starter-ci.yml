name: Azure DevOps Entra starter CI

on:
  pull_request:
    paths:
      - 'examples/azure-devops-entra-gate/**'
      - '.github/workflows/azure-devops-starter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/azure-devops-entra-gate/**'
      - '.github/workflows/azure-devops-starter-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax and unit tests
        run: |
          npm ci --ignore-scripts --prefix examples/azure-devops-entra-gate
          node --check examples/azure-devops-entra-gate/lib.mjs
          node --check examples/azure-devops-entra-gate/validate.mjs
          node --check examples/azure-devops-entra-gate/batch.mjs
          node --check examples/azure-devops-entra-gate/batch-validate.mjs
          node --test examples/azure-devops-entra-gate/tests/*.node.mjs
