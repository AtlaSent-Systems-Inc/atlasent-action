name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate action.yml
        run: python3 .github/scripts/validate_action.py

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet -- dist/index.js; then
            echo "::error::dist/index.js is out of date. Run 'npm run build' and commit dist/index.js."
            git --no-pager diff --stat -- dist/index.js
            exit 1
          fi

      - run: npm test

      # ── Azure DevOps Pipelines extension (packages/azure-devops-task) ────────
      # Separate typecheck/build from the root ones above (its own tsconfig,
      # its own esbuild bundle target) — mirrors the precedent already set for
      # @atlasent/enforce and @atlasent/action in publish-packages.yml, but on
      # every PR/push rather than only on a publish tag, since this package's
      # build output (AtlaSentGate/dist/index.js) is a committed runtime
      # artifact an Azure Pipelines agent runs directly, same "commit the
      # runtime artifact" contract as the GitHub Action's own dist/index.js.
      - run: npm run typecheck -w @atlasent/azure-devops-task

      - run: npm run build -w @atlasent/azure-devops-task

      - name: Verify AtlaSentGate/dist/index.js is up to date
        run: |
          if ! git diff --quiet -- packages/azure-devops-task/AtlaSentGate/dist/index.js; then
            echo "::error::packages/azure-devops-task/AtlaSentGate/dist/index.js is out of date. Run 'npm run build -w @atlasent/azure-devops-task' and commit it."
            git --no-pager diff --stat -- packages/azure-devops-task/AtlaSentGate/dist/index.js
            exit 1
          fi

      # npm test above (vitest, run from the repo root) already picks up
      # packages/azure-devops-task/src/__tests__/**, same as it already does
      # for packages/enforce and packages/action — no separate test step
      # needed here.
