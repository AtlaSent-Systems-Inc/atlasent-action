name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build and publish (e.g. v1.3.0). Use a vX.Y.Z tag to publish a release.'
        default: 'main'
      bootstrap:
        description: 'Skip the AtlaSent release gate for the bootstrap (first) publish, when no v1 of the action exists yet to gate with.'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # required for cosign keyless signing (Sigstore OIDC)
  statuses: write   # required for the AtlaSent gate's best-effort commit-status post

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for cosign keyless signing (Sigstore OIDC)
      statuses: write   # required for the AtlaSent gate's best-effort commit-status post
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      # The committed dist/index.js is the artifact GitHub Actions runs. It must
      # already match source at release time — we verify rather than commit, so
      # the release never mutates the repo (the old approach git-pushed on a
      # detached HEAD during tag builds and failed).
      - name: Verify committed dist is current
        run: |
          if ! git diff --quiet -- dist/index.js; then
            echo "::error::dist/index.js is out of date with src/. Run 'npm run build' and commit dist/index.js before tagging a release."
            git --no-pager diff --stat -- dist/index.js
            exit 1
          fi

      # ── AtlaSent release gate (dogfood) ───────────────────────────────────
      # Gated on the action's OWN code (uses: ./), so each release is authorized
      # by the very build it is releasing. Skipped only for the one-time
      # bootstrap publish (workflow_dispatch with bootstrap=true), which breaks
      # the chicken-and-egg of publishing v1 before any v1 exists to gate with.
      # Subsequent tag-push releases run the gate.
      #
      # KNOWN OPEN ISSUES (both require atlasent-api / operator action, NOT
      # an atlasent-action code change — do not "fix" either by spoofing the
      # actor or context below):
      #   1. STILL OPEN (unverified as of 2026-08-21). The last real
      #      (non-bootstrap) gate runs (2026-06-29, run IDs 28344572087 /
      #      28344637307) failed closed with "AtlaSent Gate: Authentication
      #      failed (HTTP 401)" from `POST /v1-evaluate` — before any policy
      #      was evaluated. This is the runtime's own
      #      `denyResponse("unauthenticated", ...)` ("API key not found or
      #      inactive"), thrown when `ATLASENT_API_KEY` doesn't resolve to
      #      an active row via `validate_api_key`. Needs an operator to
      #      verify/rotate the `ATLASENT_API_KEY` / `ATLASENT_BASE_URL` repo
      #      secrets against the runtime project (kttccumlnmdtupgbyfue) in
      #      atlasent-api. This gate will still 401 until that verification
      #      happens, independent of issue 2's status below.
      #   2. RESOLVED IN SHAPE AND DECIDED — apply status unconfirmed on
      #      production as of 2026-08-21 (updated; this comment previously
      #      described this as "pending a founder decision," which is now
      #      stale). The founder decision WAS made and recorded, twice, in
      #      atlasent-api: migration `20260852000000_package_release_
      #      manager_bettyc925.sql` replaced the `package.release`
      #      allow-list's placeholder identity with `github:bettyc925` as
      #      the release-manager identity ("for now ... revisit around
      #      2026-11-11" — a ~3-month window from the 2026-08-10 decision,
      #      not a permanent grant), and `20260853000000_seed_package_
      #      release_atlasent_action_gate.sql` activated the resulting
      #      template D for this repo's confirmed real org
      #      (`1a67b4ca-70d5-4e0b-bebf-0aca6cca21e7`). Both migrations are
      #      merged to atlasent-api's `main` and confirmed applied on
      #      **staging** (verified directly against a `deploy-staging.yml`
      #      run's migration-list output, not inferred from the migration
      #      log). **Production apply status was not directly verified** —
      #      per atlasent-api's own hard-won lesson, neither a migration-log
      #      entry nor deploy-run timing proves an object exists on a given
      #      target; only a direct query does (`docs/MIGRATION_LOG.md`'s own
      #      "production object verification is evidence" rule). If this
      #      gate is still denying on a real (non-bootstrap) release attempt
      #      after issue 1 is resolved, check whether these two migrations
      #      have actually reached the production runtime project — that is
      #      now the remaining gap, not an open decision.
      - name: AtlaSent release gate
        if: ${{ github.event.inputs.bootstrap != 'true' }}
        uses: ./
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          ATLASENT_BASE_URL: ${{ secrets.ATLASENT_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Must be a GATE_PERMITTED_ACTIONS value (src/canonicalAction.ts):
          # production.deploy | package.release. `package.release` is the
          # canonical "release a package" action and the correct fit for
          # gating the action's own release. The previous value
          # `production.release` is not in the allowlist, so the gate
          # self-rejected with "unsupported protected action" before ever
          # calling the API — blocking every release after the allowlist was
          # tightened. (Requires a package.release policy on the gate org to
          # ALLOW; otherwise it fails closed by design.)
          action: package.release
          actor: ${{ github.actor }}
          environment: prod
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      # ── R4: cosign keyless signing ────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign dist/index.js (keyless, Sigstore Fulcio + Rekor)
        # cosign uses the GitHub Actions OIDC token — no long-lived key secret.
        # The resulting bundle (dist/index.js.bundle) contains the certificate
        # chain and transparency-log entry needed to verify the signature.
        run: |
          cosign sign-blob \
            --yes \
            --bundle=dist/index.js.bundle \
            dist/index.js

      - name: Verify signature
        # Smoke-test: re-verify using the bundle we just produced.
        run: |
          cosign verify-blob \
            --bundle=dist/index.js.bundle \
            --certificate-identity-regexp='https://github.com/AtlaSent-Systems-Inc/atlasent-action/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            dist/index.js

      # ── Resolve which tag (if any) to publish ─────────────────────────────
      # Publish on a tag push, or on a manual dispatch whose ref is a vX.Y.Z tag
      # (the bootstrap path). A dispatch against 'main' builds + signs but does
      # not publish a release.
      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${{ github.event.inputs.ref }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Publish the GitHub Release (this is what lists the action) ─────────
      - name: Create GitHub Release
        if: ${{ steps.rel.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/index.js.bundle --clobber
          else
            gh release create "$tag" \
              dist/index.js.bundle \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi

      # ── Move the floating v1 tag to this release ──────────────────────────
      # Customers reference `uses: AtlaSent-Systems-Inc/atlasent-action@v1`, so
      # v1 must track the latest v1.x release. Replaces the old workflow that
      # force-pushed v1 to a hardcoded, drift-prone SHA.
      - name: Update floating v1 tag
        if: ${{ steps.rel.outputs.publish == 'true' && startsWith(steps.rel.outputs.tag, 'v1.') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1 '${{ steps.rel.outputs.tag }}'
          git push origin refs/tags/v1 --force
