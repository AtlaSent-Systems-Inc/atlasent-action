name: 'AtlaSent Gate'
description: 'Enforce real-time authorization gates on deployments and critical CI/CD actions with cryptographic audit trails'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  action:
    description: 'Protected action type (e.g., production.deploy, database.migration.apply, hr.employee.offboard). See the AtlaSent catalog for all 19 built-in types. Used for single-eval path; ignored when evaluations or policy-sync is set.'
    required: false
  actor:
    description: 'Triggering human identity (defaults to github.actor). For production.deploy, authorization uses a GitHub OIDC workload actor minted by the AtlaSent runtime instead; this value is retained separately as triggering_actor provenance and cannot substitute for workload identity.'
    required: false
    default: '${{ github.actor }}'
  target-id:
    description: 'Target resource being acted on (service name, artifact id, etc). Threaded into both top-level target_id and context.target_id so policies can gate on what is being deployed, not just who is deploying.'
    required: false
  artifact-digest:
    description: 'SHA-256 digest of the artifact being deployed (e.g. sha256:<image-or-plan-hash>). For production.deploy this becomes change_plan.artifact_ref and the runtime derives the permit execution hash from the complete plan; for other actions it remains the direct execution_payload_hash. At a separate verify-permit boundary, pass the gate output execution-hash rather than this raw artifact digest.'
    required: false
  evidence-profile:
    description: 'JSON solo-operator compensating-control evidence for a NON-production.deploy action type (e.g. {"kind":"control_override","control_id":"...","override_scope":"...","reason":"...","expires_at":"..."} or {"kind":"access_grant",...} — see atlasent-api _shared/solo-operator-evidence-profile.ts for the full field set per kind). Used both by a solo-operator-attest step (to record the evidence) and the later evaluate step (to derive the SAME hash the attestation is compared against). No effect unless solo-operator-context is also "true" and the action class actually requires independent approval.'
    required: false
  solo-operator-context:
    description: 'Set "true" to add context.solo_operator_compensating_control:{} to this evaluate call — the trigger the runtime''s solo-operator compensating control (atlasent-api _shared/solo-operator-compensating-control.ts) checks for. Grants no authority by itself: a no-op unless the action class requires independent approval, the ordinary approving_reviewers path is unprovable, AND a prior solo-operator-attest step already recorded matching evidence (fresh, same change_plan/evidence-profile). Equivalent to passing context: ''{"solo_operator_compensating_control":{}}'' by hand.'
    required: false
    default: 'false'
  execution-hash:
    description: 'Opaque runtime-derived execution binding from a prior evaluate-only gate. Required for a separate production.deploy verify-permit step; pass steps.<gate>.outputs.execution-hash unchanged. Do not compute or substitute this value in the workflow.'
    required: false
  verify-permit:
    description: 'Set "true" to run VERIFY-ONLY mode at the execution boundary. Requires permit-token plus the original action/environment/target bindings. For production.deploy, also pass the prior gate output execution-hash; for other actions, pass artifact-digest when one was bound. Fails closed on missing, modified, expired, replayed, denied, or context-mismatched permits.'
    required: false
    default: 'false'
  permit-token:
    description: 'The permit token to re-verify (required in verify-permit mode). Typically the permit-token output of an earlier gate step, passed to the deploy step.'
    required: false
  mode:
    description: |
      Single-eval execution model (ignored on batch / policy-sync / verify-permit / release / vqp / governance paths).
        - "enforce" (default): evaluate → verify → CONSUME the single-use permit in THIS step, then output verified=true. Best for a one-step gate.
        - "evaluate-only": ISSUE a permit but do NOT verify or consume it. For the two-step EXECUTION-BOUNDARY pattern: this step issues the permit (outputs decision + permit-token UNCONSUMED + permit-issued=true, verified=false); a later `verify-permit: true` step re-verifies and consumes it at the deploy step (the real cryptographic boundary). You MUST gate the protected step on that later step's `verified == 'true'` — never on this step's decision.
    required: false
    default: 'enforce'
  wait-for-approval:
    description: |
      Set "true" to pause-and-resume on a HOLD/ESCALATE decision instead of failing the step immediately (mode: enforce only — ignored/rejected with evaluate-only, which is its own two-step pattern). When the runtime returns hold/escalate with an approval_request_id, this step polls GET /v1/approvals/{id} on atlasent-api (bounded by max-wait-minutes) for a human resolution in AtlaSent Console. On "approved", the step re-verifies the FRESH permit against the SAME action/target/environment and runtime-derived execution binding — never trusting "approved" alone — before treating it as allow. Denied, expired, timed-out, or an approved-with-no-fresh-permit resolution all fail closed, same as any other deny.
    required: false
    default: 'false'
  max-wait-minutes:
    description: 'Maximum minutes to wait for a human decision when wait-for-approval is "true" (default: 30). Exceeding this fails the step closed — no deploy without a resolution inside the window.'
    required: false
    default: '30'
  environment:
    description: 'Environment (defaults to live for main branch, test otherwise)'
    required: false
  api-url:
    description: 'AtlaSent API URL base. Set to your Supabase project URL ending in /functions/v1 (e.g. https://<ref>.supabase.co/functions/v1). If not set, falls back to the ATLASENT_BASE_URL env var, then https://api.atlasent.io. NOTE: the api.atlasent.io apex 404s unless a custom domain is verified — always set this or ATLASENT_BASE_URL for self-hosted or pilot deployments.'
    required: false
  fail-on-deny:
    description: 'Deprecated in V1 pilot mode: deny/hold/escalate always fail closed regardless of this value.'
    required: false
    default: 'true'
  context:
    description: 'JSON context to include in the evaluation (optional). Used for single-eval path. Values here override anything the action derives automatically (e.g. an explicit `approvals` count wins over PR-review-derived approvals).'
    required: false
    default: '{}'
  approvals-from:
    description: |
      Where the `context.approvals` count comes from on the single-eval path.
        - "pr-reviews" (default): count distinct reviewers whose latest PR
          review is APPROVED, derived from the GitHub API, and inject as
          context.approvals + context.approving_reviewers. Lets the
          `allow-2-approvals-change-window` policy template work out of the box.
          Requires GITHUB_TOKEN (set `env: GITHUB_TOKEN` to your token secret).
        - "none": do not derive approvals; supply them via the `context` input.
      Best-effort and fail-open-to-zero: any API failure yields 0 approvals,
      which denies a count-gated deploy (the fail-closed direction).
    required: false
    default: 'pr-reviews'
  approval-artifact-mint:
    description: |
      When `approvals-from: pr-reviews` and the evaluate() call denies with
      INSUFFICIENT_APPROVALS asking for a real signed approval_artifact.v1
      (atlasent-api#2830), automatically mint one FROM the PR's actual
      GitHub reviews (via v1-github-approval-mint, independently
      re-verified server-side through the org's GitHub App installation —
      never a self-reported count) and retry once. Set "false" to disable
      this and let the original deny stand unretried — e.g. if the API key
      does not carry the `approval_artifact:mint` scope. Requires
      GITHUB_TOKEN (same as approvals-from: pr-reviews). A minting failure
      (no qualifying reviewer, endpoint unreachable) never escalates beyond
      the original deny.
    required: false
    default: 'true'
  evaluations:
    description: 'JSON array of evaluation requests for batch mode, e.g. [{"action":"production.deploy","actor":"ignored","environment":"production"}]. Each production.deploy item requires environment and uses its own runtime-minted GitHub OIDC workload actor; caller actor and actor_identity values cannot authorize it. When set, single-eval inputs (action, actor, context) are ignored.'
    required: false
  wait-for-id:
    description: 'Batch mode (evaluations input) only — NOT the single-eval path, see wait-for-approval for that. Approval request ID to block on until it reaches a terminal state (approved/denied/...). Polls the same GET /v1/approvals/{id} endpoint wait-for-approval uses.'
    required: false
  wait-timeout-ms:
    description: 'Maximum milliseconds to wait for a terminal decision when wait-for-id is set (default: 600000 = 10 min; maximum: 3600000 = 60 min).'
    required: false
    default: '600000'
  v2-batch:
    description: 'Enable the /v1-evaluate/batch endpoint for batch evaluations (default: false, falls back to sequential /v1-evaluate loop).'
    required: false
    default: 'false'
  v2-streaming:
    description: 'No effect — there is no Server-Sent Events endpoint on the runtime API to stream from. Kept only so existing workflow YAML setting this input does not hard-fail; wait-for-id always polls.'
    required: false
    default: 'false'
  financial-governance:
    description: 'Enable financial governance advisory ("advisory" or "")'
    required: false
    default: ''
  financial-action-value:
    description: 'Dollar value of the financial action being evaluated'
    required: false
    default: ''
  financial-action-currency:
    description: 'Currency code for the financial action value'
    required: false
    default: 'USD'
  receipt-signing-key-id:
    description: |
      Key ID recorded in the evidence receipt for rotation tracking.
      Paired with the ATLASENT_RECEIPT_SIGNING_SECRET Actions secret so
      offline verifiers know which key to use. Omit if you do not rotate
      signing keys or do not need signed receipts.
    required: false
    default: ''
  # ── Policy Sync ─────────────────────────────────────────────────────────────────────────────
  policy-sync:
    description: |
      When "true", run in policy sync mode: read a JSON bundle file and post it
      to v1-policy-sync. CI fails when the run is rejected or invalid.
      Cannot be combined with the evaluations or action inputs.
    required: false
    default: 'false'
  policy-bundle:
    description: |
      Path to the policy bundle JSON file, relative to the repository root.
      Must be a JSON array of policy entries: [{name, body, description?, tags?}].
      Required when policy-sync is "true".
    required: false
  policy-source:
    description: 'Source label written into the sync run record (defaults to "github-action").'
    required: false
    default: 'github-action'
  policy-dry-run:
    description: |
      When "true" (default), submit as a dry-run to preview the diff without
      applying. Set to "false" on the default branch to apply changes live.
    required: false
    default: 'true'
  # ── Behavior Insights ─────────────────────────────────────────────────────────────────────
  insights-org-id:
    description: |
      Organization ID for behavior insights campaign evaluation. When set,
      the action runs a campaign evaluate call after a successful authorization
      (best-effort: never blocks or reverses the gate decision).
    required: false
  insights-subject-id:
    description: 'Subject ID for insights evaluation. Defaults to the actor value.'
    required: false
  insights-session-count:
    description: 'Number of sessions for the subject, used by session_count trigger campaigns.'
    required: false
    default: ''
  # ── Release-candidate post-deploy verification ────────────────────────────────────────────
  release-mode:
    description: |
      When "register-and-verify", run as a POST-deploy step against the
      atlasent-control-plane release-verification surface:
        1. POST /v1/release/candidates           (register the candidate)
        2. POST /v1/release/candidates/:id/verify/runtime
        3. POST /v1/release/candidates/:id/verify/deploy
      Mutually exclusive with the evaluate/policy-sync paths.
    required: false
    default: ''
  control-plane-url:
    description: 'atlasent-control-plane base URL (release-mode only).'
    required: false
  control-plane-token:
    description: |
      Bearer token for the control-plane. Either set this input or the
      ATLASENT_CP_TOKEN env var. Distinct from ATLASENT_API_KEY (which
      authenticates against the runtime). Required when release-mode is set.
    required: false
  release-target-runtime-url:
    description: 'URL of the deployed atlasent-api runtime to probe (release-mode only).'
    required: false
  release-repo:
    description: 'Repository identifier registered with the candidate. Defaults to the current repository.'
    required: false
  release-commit-sha:
    description: 'Commit SHA registered with the candidate. Defaults to the current commit SHA.'
    required: false
  release-image-digest:
    description: 'Optional image digest (e.g. sha256:...) registered with the candidate.'
    required: false
  release-semver:
    description: 'Optional semver string registered with the candidate.'
    required: false
  release-environment:
    description: 'preview | staging | production. Required when release-mode is set.'
    required: false
  release-fail-on-verify:
    description: 'When "true" (default), fail the step if either verify/runtime or verify/deploy returns failed/error.'
    required: false
    default: 'true'
  # ── Governance Agents ───────────────────────────────────────────────────────────────────────
  governance-agents:
    description: |
      Comma-separated list of constrained advisory governance-agent slugs to
      run against the current change. Cannot be combined with policy-sync,
      evaluations, action, or release-mode inputs.
    required: false
    default: ''
  governance-change-id:
    description: 'Governed change UUID to attach findings to. Required when governance-agents is set.'
    required: false
    default: ''
  governance-artifact-file:
    description: 'Optional path to a JSON file mapping agent slug to a pre-built artifact.'
    required: false
    default: ''
  governance-fail-on-severity:
    description: |
      Minimum severity (info|low|medium|high|blocker) that fails the step.
      Findings are advisory by default.
    required: false
    default: ''
  governance-fail-on-blocker:
    description: 'Shortcut for governance-fail-on-severity: blocker.'
    required: false
    default: 'false'
  # ── Outbound notifications ───────────────────────────────────────────────────────────
  slack-webhook:
    description: |
      Slack Incoming Webhook URL. When set, the action posts an informational
      Block Kit message to this URL whenever the deploy gate returns deny,
      hold, or escalate. This is outbound notification only — no interactive
      approval buttons. For in-flow approvals, use the AtlaSent Slack Approval
      Bot instead (configured in the AtlaSent console).
      Best-effort: webhook failures are logged as warnings and never block or
      alter the gate decision.
    required: false
    default: ''
  pr-comment-on-deny:
    description: |
      When "true" (default), post a comment to the pull request when the gate
      returns deny, hold, or escalate and a PR number is detected in the
      workflow context. Requires: permissions: pull-requests: write in the
      workflow, and GITHUB_TOKEN must be available.
      Best-effort: comment failures are logged as warnings and never block or
      alter the gate decision. Set to "false" to suppress PR comments.
    required: false
    default: 'true'
  # ── Change Brief (production-change impact preparation) ──────────────────────────────
  change-brief:
    description: |
      When "true", run in change-brief mode instead of evaluate: gather this
      run's real GitHub/CI facts (base/head SHA, changed files, check-run
      conclusions), call v1-change-brief, and render an evidence-bound
      management decision brief: what is changing, the translated impact,
      what AtlaSent established automatically, and what remains unknown —
      BEFORE a deploy is authorized. Mints no permit and authorizes nothing;
      a separate evaluate/verify step (the default `action:` mode) remains
      the actual authorization gate. Mutually exclusive with evaluate,
      policy-sync, release-mode, governance-agents, vqp-snapshot-id, and
      trajectory-verify. Requires GITHUB_TOKEN (for the diff/check-run reads)
      in addition to ATLASENT_API_KEY.
    required: false
    default: 'false'
  change-brief-action:
    description: 'Protected action type for the brief. Defaults to the `action` input, then production.deploy. Unlike evaluate mode, not restricted to a client-side allowlist — the runtime action-class configuration is the real authority.'
    required: false
    default: ''
  change-brief-target-system:
    description: 'target_system for the brief subject. Defaults to "github".'
    required: false
    default: ''
  change-brief-target-id:
    description: 'target_id for the brief subject. Defaults to the `target-id` input, then the repository (owner/repo).'
    required: false
    default: ''
  change-brief-base-sha:
    description: 'Explicit base revision override. Required for events other than pull_request/push (e.g. workflow_dispatch), where no base SHA can be resolved automatically.'
    required: false
    default: ''
  change-brief-head-sha:
    description: 'Explicit head revision override. Defaults to the resolved PR head SHA (pull_request events) or GITHUB_SHA.'
    required: false
    default: ''
  change-request:
    description: 'Optional business reason / ticket reference for the change, reproduced verbatim in the brief (never inferred from the diff).'
    required: false
    default: ''
  rollback-previous-sha:
    description: 'Previously deployed revision, if known — reported as rollback evidence rather than left as a missing-evidence gap.'
    required: false
    default: ''
  rollback-workflow:
    description: 'Name of a workflow that can roll this deployment back, if one exists.'
    required: false
    default: ''
  rollback-reference:
    description: 'A rollback runbook/reference URL or identifier, if one exists.'
    required: false
    default: ''
  console-base-url:
    description: 'Base URL of the AtlaSent console, used to build the change-brief-console-url output. Defaults to https://console.atlasent.io.'
    required: false
    default: ''
  pr-comment-on-change-brief:
    description: |
      When "true", post the change-brief job summary as a PR comment (when a
      PR number is detected). Default "false" — unlike pr-comment-on-deny,
      this is opt-in, since a brief comment on every push would be noisy for
      workflows that run change-brief mode on every commit.
    required: false
    default: 'false'
  # ── Solo-operator compensating-control attestation ────────────────────────────────────
  solo-operator-attest:
    description: |
      Set "true" to run solo-operator ATTEST mode instead of evaluate — mints a
      GitHub-OIDC-verified actor identity bound to solo_operator.attest and
      POSTs it plus this change''s evidence to /v1-solo-operator-attest,
      recording (never authorizing) evidence a LATER `action:` evaluate step
      can rely on. Requires `id-token: write`. Run as its own step, before the
      real evaluate step; pass solo-operator-context: "true" (and, for a
      non-production.deploy action, the SAME evidence-profile) to that later
      step. See atlasent-api _shared/solo-operator-compensating-control.ts.
    required: false
    default: 'false'
  solo-operator-action-class-id:
    description: 'UUID of this org''s action_classes row for `action` (required when solo-operator-attest is "true"). Find it via the AtlaSent console or API — not derivable from the action_type string alone.'
    required: false
  solo-operator-attestation-reason:
    description: 'Contemporaneous, human-written justification for this attestation (required when solo-operator-attest is "true"; minimum 20 characters, enforced server-side).'
    required: false
  commit-sha:
    description: 'Commit SHA the solo-operator attestation is FOR (CI-status/cooling-off/staging-acceptance lookup key). Defaults to GITHUB_SHA.'
    required: false
  # ── Post-deploy compliance evidence bundle ────────────────────────────────────────────
  evidence-bundle:
    description: |
      When set to "true" or a regime identifier, call POST /v1/orgs/{orgId}/evidence-exports
      after a successful authorization gate.
      Accepted values: 'false' | 'true' | 'soc2_type_ii' | 'hipaa' | 'gdpr'
    required: false
    default: 'false'
  evidence-bundle-days:
    description: 'Lookback window in days for the evidence bundle (default: 90).'
    required: false
    default: '90'
  # ── VQP Re-Derivation Verify ───────────────────────────────────────────────────────────
  vqp-snapshot-id:
    description: |
      UUID of the VQP snapshot to re-derive and audit. Mutually exclusive with
      evaluate, policy-sync, release-mode, governance-agents, and trajectory-verify.
    required: false
    default: ''
  vqp-supabase-url:
    description: 'Supabase project URL for the VQP edge functions. Required when vqp-snapshot-id is set.'
    required: false
    default: ''
  vqp-service-role-key:
    description: 'Supabase service role key. Required when vqp-snapshot-id is set.'
    required: false
    default: ''
  vqp-rerun:
    description: 'When "true", re-run the AI engine on the re-derived prompt to detect score drift.'
    required: false
    default: 'false'
  vqp-fail-on-drift:
    description: 'When "true" (default), fail the job if hash_match=false or verdict_changed=true.'
    required: false
    default: 'true'
  # ── Trajectory Authorization ─────────────────────────────────────────────────────────────
  trajectory-verify:
    description: |
      When "true", run in trajectory-verify mode: call POST /v1/trajectory-verify
      at this CI step and fail if on_trajectory=false. Use as an intermediate step
      before each critical execution unit in the authorized trajectory.
      Requires trajectory-permit-id and trajectory-step-id from the upstream
      evaluate step that returned an authorized_trajectory.
      Mutually exclusive with policy-sync, governance-agents, release-mode, and vqp-snapshot-id.
    required: false
    default: 'false'
  trajectory-permit-id:
    description: 'Authorized transition spec ID from the upstream AtlaSent evaluate step (evaluation-id output). Required when trajectory-verify is "true".'
    required: false
    default: ''
  trajectory-step-id:
    description: 'Step ID within the trajectory being verified. Must match a step_id in the authorized_trajectory. Required when trajectory-verify is "true".'
    required: false
    default: ''
  trajectory-step-name:
    description: 'Human-readable step name written to the job summary and audit log. Optional.'
    required: false
    default: ''
  trajectory-halt-on-deviation:
    description: |
      When "true" (default), fail the CI job immediately when on_trajectory=false.
      Set to "false" to surface deviation outputs without failing — useful for
      dry-run or advisory monitoring pipelines.
    required: false
    default: 'true'
outputs:
  solo-attestation-id:
    description: 'UUID of the recorded solo_operator_attestations row. Set only by solo-operator-attest mode. Empty on failure (fail-closed — no partial attestation is ever recorded).'
  solo-attested-by:
    description: 'The verified solo-operator identity the attestation is recorded under (server-derived from the action class''s solo_operator_attested_identity, never a caller-supplied value). Set only by solo-operator-attest mode.'
  decision:
    description: 'The evaluation decision (allow/deny/hold/escalate). Set for single-eval path only.'
  permit-token:
    description: 'The permit token. On the default (enforce) path it is already consumed by v1-verify-permit (audit reference only). In evaluate-only mode it is UNCONSUMED — pass it to a later verify-permit step to re-verify and consume it at the execution boundary. Single-eval path only.'
  evaluation-id:
    description: 'The evaluation ID for audit trail. Single-eval path only.'
  execution-hash:
    description: 'Runtime-derived execution binding. In evaluate-only mode, pass this unchanged to the later verify-permit step as the execution-hash input.'
  proof-hash:
    description: 'The cryptographic proof hash. Single-eval path only.'
  risk-score:
    description: 'The numeric risk score from the Decision response. Empty string when the evaluator did not return a risk assessment. Single-eval path only.'
  verified:
    description: '"true" when evaluate=allow AND verify-permit=true for ALL evaluations; "false" otherwise (fail-closed). Set on both single and batch paths, and in verify-permit (boundary) mode.'
  waited-for-approval:
    description: '"true" when single-action wait-for-approval observed a hold or escalation and waited for its terminal decision. "false" when no approval wait was needed or enabled. Single-action path only.'
  permit-issued:
    description: '"true" when a permit was minted on the single-eval path. In evaluate-only mode this is "true" while verified is "false" (issued but not consumed — re-verify at the execution boundary). "false" on non-allow or when no permit was minted. Do NOT gate a deploy on this — gate on verified.'
  verify-outcome:
    description: 'Coarse verification outcome from the last permit verification (verified / mismatch / expired / revoked / replay_blocked / invalid). Set on the single-eval and verify-permit (boundary) paths. Empty when verification did not run.'
  verify-error-code:
    description: 'Precise runtime verify wire code when verification failed (e.g. PAYLOAD_MISMATCH, ENVIRONMENT_MISMATCH, PERMIT_EXPIRED, PERMIT_ALREADY_USED, MISSING_PERMIT). Empty on success. Lets a workflow distinguish WHY a permit was rejected.'
  decisions:
    description: 'JSON array of per-item decision results for the batch path. Each item: {decision, verified, evaluationId, permitToken, reasons, verifyOutcome}.'
  batch-id:
    description: 'Batch identifier for batch evaluations (either the server-assigned batchId or loop-<ts> for the sequential fallback).'
  change-brief-id:
    description: 'brief_id from v1-change-brief. Change-brief mode only.'
  change-brief-recommendation:
    description: 'The brief''s recommendation value (approve/request_evidence/escalate/deny) — a RECOMMENDATION for a human reviewer, never an authorization decision. Change-brief mode only.'
  change-brief-classification:
    description: 'The brief''s classification value (routine/review_ready/incomplete/exceptional/prohibited). Change-brief mode only.'
  change-brief-material-differences-count:
    description: 'Count of material_differences the brief reported (e.g. detected migration, workflow change). Change-brief mode only.'
  change-brief-canonical-plan-digest:
    description: 'The sha256:<hex> canonical_plan_digest computed for this base/head SHA pair — pass the SAME value as evaluate''s context.canonical_plan_digest so the brief and the eventual permit describe the same change. Change-brief mode only.'
  change-brief-console-url:
    description: 'Deep link into the AtlaSent console review screen. NOTE: does not yet carry this run''s GitHub-sourced facts (a documented gap — see README) — the job summary is the complete record. Change-brief mode only.'
  change-brief-decision-readiness:
    description: 'Queue-ready advisory state: ready_for_review or evidence_incomplete. Never an authorization decision and never safe to use as a deployment gate. Change-brief mode only.'
  change-brief-source-collection:
    description: 'Whether the GitHub comparison and check-run reads were complete or partial. An empty fact set from a failed read is always partial, never presented as an observed zero. Change-brief mode only.'
  change-brief-blocking-evidence-count:
    description: 'Count of blocking evidence gaps identified by v1-change-brief. Advisory routing signal only; execution still requires evaluate/permit. Change-brief mode only.'
  change-brief-decision-brief:
    description: 'JSON management_decision_brief.v1 projection with business rationale, translated impact, automatic-analysis counts, next actions, exact evidence binding, and an explicit advisory-only authority boundary. Change-brief mode only.'
  financial-governance-advice:
    description: 'JSON advisory output from financial governance assessment'
  chain-entry:
    description: 'v1.1 immutable audit chain entry (JSON)'
    value: ${{ steps.gate.outputs.chain-entry }}
  snapshot:
    description: 'Decision snapshot (JSON)'
    value: ${{ steps.gate.outputs.snapshot }}
  audit-hash:
    description: 'SHA-256 audit chain hash'
    value: ${{ steps.gate.outputs.audit-hash }}
  evidence-receipt:
    description: |
      Signed per-decision authorization receipt (JSON). HMAC-SHA256 signed when
      ATLASENT_RECEIPT_SIGNING_SECRET is set as an Actions secret. null on denial.
  evidence-bundle:
    description: |
      Full compliance evidence bundle (JSON, v1 envelope). null on denial.
  # ── Policy Sync outputs ──────────────────────────────────────────────────────────────────
  sync-run-id:
    description: 'The policy sync run ID returned by v1-policy-sync.'
  sync-status:
    description: 'Terminal status of the sync run (completed, rejected, failed, error).'
  sync-diff:
    description: 'Human-readable diff summary, e.g. "+3 added, ~1 updated, -2 removed".'
  sync-summary:
    description: 'JSON {added, updated, removed, status}.'
  # ── Behavior Insights outputs ───────────────────────────────────────────────────────────
  insights-fired:
    description: 'JSON array of behavior insights campaigns that fired for the subject.'
  insights-skipped:
    description: 'JSON array of behavior insights campaigns that were skipped, with reasons.'
  # ── Release-candidate outputs ──────────────────────────────────────────────────────────────
  release-candidate-id:
    description: 'Candidate ID returned by POST /v1/release/candidates (release-mode only).'
  release-runtime-status:
    description: 'Outcome status of the runtime verification: passed | failed | partial | error.'
  release-deploy-status:
    description: 'Outcome status of the deploy verification: passed | failed | partial | error.'
  release-runtime-result:
    description: 'Full JSON result of the runtime verification.'
  release-deploy-result:
    description: 'Full JSON result of the deploy verification.'
  # ── Governance Agents outputs ───────────────────────────────────────────────────────────
  governance-findings-count:
    description: 'Total number of findings emitted across all invoked governance agents.'
  governance-highest-severity:
    description: 'Highest severity emitted across all findings (info|low|medium|high|blocker).'
  governance-evaluations:
    description: 'JSON array of evaluation summaries per agent.'
  governance-findings:
    description: 'JSON array of all findings across all invoked agents.'
  # ── Evidence bundle outputs ──────────────────────────────────────────────────────────────
  evidence-bundle-sha256:
    description: 'SHA-256 hex digest of the generated compliance evidence bundle.'
  evidence-bundle-id:
    description: 'Evidence export record ID returned by POST /v1/orgs/{orgId}/evidence-exports.'
  # ── VQP Re-Derivation outputs ───────────────────────────────────────────────────────────
  vqp-hash-match:
    description: '"true" when the re-derived SHA-256 hash matches the stored prompt_hash (vqp-verify mode only).'
  vqp-score-delta:
    description: 'Numeric score delta between rerun and original snapshot scores (vqp-verify mode only).'
  vqp-verdict-changed:
    description: '"true" when the verdict flipped between the original snapshot and the AI rerun (vqp-verify mode only).'
  vqp-audit-id:
    description: 'Audit log entry ID written by v1-verify-vqp for this re-derivation run (vqp-verify mode only).'
  # ── Trajectory Verify outputs ───────────────────────────────────────────────────────────
  trajectory-on-trajectory:
    description: '"true" when the current step is on the authorized trajectory; "false" on deviation (trajectory-verify mode only).'
  trajectory-deviation-type:
    description: 'Deviation type on deviation: step_not_on_trajectory | step_out_of_sequence | forbidden_state_reached | required_step_skipped | time_limit_exceeded | constraint_violation | trajectory_expired. Empty string when on trajectory (trajectory-verify mode only).'
  trajectory-fidelity-score:
    description: 'Fidelity score [0-1] representing how closely execution tracks the authorized trajectory so far (trajectory-verify mode only).'
  trajectory-compliance-artifact-id:
    description: 'Compliance comparison artifact ID produced when trajectory execution completes. Empty string mid-execution (trajectory-verify mode only).'
runs:
  using: 'node24'
  main: 'dist/index.js'
